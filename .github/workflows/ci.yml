name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js 22.23.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production release
        run: npm run build

      - name: Run unit and content tests
        run: npm test

      - name: Run gateway smoke test
        run: npm run test:gateway

      - name: Run service-worker upgrade tests
        run: npm run test:sw-upgrade

      - name: Upload release manifest
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: release-manifest
          path: dist/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Chrome production flows
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js 22.23.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chrome and browser dependencies
        run: npx playwright install --with-deps chrome

      - name: Run production browser matrix
        run: npm run test:e2e

      - name: Verify exact offline release
        run: npm run test:offline

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            .gstack/playwright-report/
            test-results/
            dist/release-manifest.json
          if-no-files-found: warn
          retention-days: 14
